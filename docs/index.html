<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BharatCode MCP Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Offline-first CLI to bootstrap and manage Model Context Protocol (MCP) servers into BharatCode CLI and Desktop.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0969da;
      --text-color-base: #1f2328;
      --sidebar-width: 280px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      color: var(--text-color-base);
    }
    .sidebar {
      background-color: #f6f8fa;
      border-right: 1px solid #d0d7de;
    }
    .sidebar-nav li a {
      font-size: 14px;
      color: #656d76;
    }
    .sidebar-nav li.active > a {
      color: var(--theme-color);
      font-weight: 600;
    }
    .markdown-section pre {
      background-color: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    .markdown-section code {
      border-radius: 4px;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
    }
    .markdown-section table th, .markdown-section table td {
      border: 1px solid #d0d7de;
      padding: 8px 12px;
    }
    .markdown-section table th {
      background-color: #f6f8fa;
    }
  </style>
</head>
<body>
  <div id="app">Loading BharatCode MCP documentation...</div>
  <script>
    window.$docsify = {
      name: 'bharatcode-mcp',
      repo: 'https://github.com/Sreeju7733/bharatcode-mcp',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify and Core Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
